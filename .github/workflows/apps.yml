# Android APK ve Windows uygulamasını derler, "latest" adlı GitHub sürümüne ekler.
# Elle çalıştırma: GitHub > Actions > "Uygulamaları derle" > Run workflow
name: Uygulamaları derle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/apps.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: Tam ekran, yatay mod ve simge
        run: |
          cp MainActivity.java android/app/src/main/java/com/duststrike/app/MainActivity.java
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          find android/app/src/main/res -name 'ic_launcher*.png' -exec cp icon.png {} \;
      - run: npx cap sync android
      - name: APK derle
        working-directory: apps/android/android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk DustStrike.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DustStrike-android
          path: apps/android/DustStrike.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: DustStrike-windows
          path: apps/windows/dist/DustStrike.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: GitHub sürümünü güncelle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/DustStrike.apk out/DustStrike.exe \
            --title "DUST STRIKE uygulamaları" \
            --notes "Android: DustStrike.apk (telefonda 'bilinmeyen kaynaklar' izni gerekir). Windows: DustStrike.exe (kurulum gerektirmez; SmartScreen uyarısında 'Yine de çalıştır'). İkisi de canlı sunucuya bağlanır."
