# Render.com kurulum dosyası: "New > Blueprint" ile bu depo seçilince sunucu otomatik kurulur.
services:
  - type: web
    name: dust-strike
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    envVars:
      # Admin paneli (/admin) şifresi. Render ilk kurulumda rastgele üretir; Environment sekmesinden görülür ve değiştirilir.
      - key: ADMIN_PASSWORD
        generateValue: true
